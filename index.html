/* Ver.9: 1st-round lottery pixel animation. SVG artwork consists of hard-edged pixel rectangles. */
.lottery-overlay{position:fixed;inset:0;z-index:240;background:rgba(6,11,25,.94);display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.lottery-dialog{width:min(560px,100%);max-height:96vh;overflow-y:auto;background:linear-gradient(160deg,#273657,#101d38);border:5px solid #efd27a;box-shadow:0 0 0 5px #091226,0 18px 70px #000b;color:#fff;text-align:center;padding:19px 16px 24px}

.lottery-arm{animation:lottery-reach 3.25s steps(8,end) both;transform-origin:160px 0px}
.lottery-ticket{animation:lottery-pull 3.25s steps(9,end) both;transform-origin:160px 150px}
.lottery-ticket-text{animation:lottery-ink 3.25s steps(1,end) both}
.lottery-glimmer{animation:lottery-glint .8s steps(2,end) infinite alternate}

.lottery-outcome.lose{color:#d6e0ed}

.lottery-continue{animation:lottery-reveal 3.5s steps(1,end) both;background:#ebba55;color:#172137;border-color:#fff0ab}

<script>
'use strict';
const STORE='penanto_lab_save_v1';
// 一部の端末（ファイルプレビューやプライベートブラウズ等）では
// localStorage が SecurityError を投げることがある。起動は止めず、一時保存に切り替える。
const transientSave=Object.create(null);
let autosaveUnavailable=false;
function safeGet(key){
 try{const v=localStorage.getItem(key);if(v!==null)return v}
 catch(e){autosaveUnavailable=true;console.warn('自動保存にアクセスできません',e)}
 return transientSave[key]??null;
}
function safeSet(key,value){
 transientSave[key]=value;
 try{localStorage.setItem(key,value)}catch(e){autosaveUnavailable=true;console.warn('自動保存が利用できません',e)}
}
function safeRemove(key){
 delete transientSave[key];
 try{localStorage.removeItem(key)}catch(e){autosaveUnavailable=true;console.warn('自動保存の削除ができません',e)}
}

const TEAMS=[
{id:'T',name:'阪南タイフーンズ',short:'阪南',league:'セ',color:'#f0bd35'},
{id:'DB',name:'横浜ベイコメッツ',short:'横浜',league:'セ',color:'#1d82d3'},
{id:'G',name:'東京ジャイロンズ',short:'ジャイロ',league:'セ',color:'#e98a30'},
{id:'D',name:'名古屋ドラグナーズ',short:'名古屋',league:'セ',color:'#315db5'},
{id:'C',name:'広島レッドフィンズ',short:'広島',league:'セ',color:'#cb4e51'},
{id:'S',name:'東京スカイウィングス',short:'スカイ',league:'セ',color:'#408c6b'},
{id:'H',name:'福岡ホークウィンズ',short:'福岡',league:'パ',color:'#dcbf52'},
{id:'F',name:'北海道ファイアーズ',short:'北海道',league:'パ',color:'#4c85be'},
{id:'B',name:'大阪バイソンズ',short:'大阪',league:'パ',color:'#776aab'},
{id:'E',name:'東北ゴールドフェニックス',short:'東北',league:'パ',color:'#ab4253'},
{id:'L',name:'埼玉レオパーズ',short:'埼玉',league:'パ',color:'#4d83b4'},
{id:'M',name:'千葉マリンブリーズ',short:'千葉',league:'パ',color:'#637887'}
];
const ROLE_B=['捕','一','二','三','遊','左','中','右','指'];
const ROLE_P=['先発1','先発2','先発3','先発4','先発5','先発6','中継ぎ1','中継ぎ2','セットアッパー1','セットアッパー2','敗戦処理1','敗戦処理2','抑え'];
const START_SLOTS=6,RELIEF_SLOTS=6,CLOSER_INDEX=START_SLOTS+RELIEF_SLOTS;
const NORMAL_SLOTS=[6,7],SETUP_SLOTS=[8,9],MOPUP_SLOTS=[10,11];
const PITCH_LAYOUT_VERSION=7;
const MAX_RELIEF_APPEARANCES=55,MIXED_IP_CAP=100,STARTER_IP_CAP=200;

function pitchRoles(p){
 if(!isPitcher(p))return [];
 if(Array.isArray(p.roles)&&p.roles.length)return p.roles;
 const idNum=Number(String(p.id).replace(/\D/g,''))||0;
 const nat=p.natural||'中';
 return nat==='先'?(idNum%3===0?['先','中']:['先']):nat==='中'?(idNum%4===0?['先','中']:idNum%3===0?['中','抑']:['中']):(idNum%2===0?['中','抑']:['抑']);
}
const isHitter=p=>p&&(p.kind==='b'||(p.twoWay===true&&!p.batInactive));
const isPitcher=p=>p&&((p.kind==='p'&&!p.pitchInactive)||(p.twoWay===true&&!p.pitchInactive));
const batStats=p=>p.twoWay?(p.bStats||(p.bStats=newStats('b'))):p.stats;
const pitchStats=p=>p.twoWay?(p.pStats||(p.pStats=newStats('p'))):p.stats;
// 新加入トレード選手は成立から暦日3日後に合流。試合のない日でも実日付で判定する。
function gameCurrentDate(){return state?.schedule?.[state.day]?.date||state?.schedule?.at(-1)?.date||'';}
function tradeReady(p){return !p?.tradeJoinDate||!gameCurrentDate()||gameCurrentDate()>=p.tradeJoinDate;}
const available=p=>p&&!p.retired&&!(p.injuryDays>0)&&tradeReady(p);
function addCalendarDays(iso,days){const d=new Date(`${iso}T12:00:00Z`);d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);}
const PLAYER_MARKS=[['','印なし'],['⭐','⭐ 注目'],['💎','💎 有望株'],['🎯','🎯 指名候補'],['🔥','🔥 即戦力'],['👀','👀 要観察'],['❤️','❤️ お気に入り'],['⚠️','⚠️ 注意']];
function playerMark(p){return state?.playerMarks?.[p?.id]||'';}
// マーク表示用の空アンカーも残し、選択後はこの部分だけを更新する。
// 画面全体を再描画すると、PCの選手詳細モーダルのスクロール位置が失われるため。
function markSymbolHtml(mark){
 if(!mark)return '';
 const label=PLAYER_MARKS.find(x=>x[0]===mark)?.[1]||'';
 return `<span class="mark-symbol" title="マーキング：${escapeHTML(label)}" aria-label="${escapeHTML(label)}">${escapeHTML(mark)}</span>`;
}

function refreshPlayerMarkDisplay(id){
 const mark=state.playerMarks?.[id]||'';
 // マークの有無にかかわらず一覧と選手詳細を即座に更新する。
 document.querySelectorAll('[data-player-mark-id]').forEach(node=>{
  if(node.dataset.playerMarkId===id)node.innerHTML=markSymbolHtml(mark);
 });
 document.querySelectorAll('select[data-kind="player-mark"]').forEach(select=>{
  if(select.dataset.id===id&&select.value!==mark)select.value=mark;
 });
}
function markSelect(p){const cur=playerMark(p);return `<label class="small">🏷 マーク <select class="field mark-picker" data-kind="player-mark" data-id="${p.id}" aria-label="${escapeHTML(p.name)}のマーキング">${PLAYER_MARKS.map(([emoji,label])=>`<option value="${emoji}" ${cur===emoji?'selected':''}>${label}</option>`).join('')}</select></label>`;}
// 詳細画面だけはネイティブ選択リストを使わず、クリック可能な絵文字を直接並べる。
// 選択ポップアップを閉じた瞬間に背後のモーダルが閉まるPC環境への対策。

function applyPlayerMark(id,mark){
 if(!PLAYER_MARKS.some(x=>x[0]===mark))return;
 state.playerMarks ||= {};
 if(mark)state.playerMarks[id]=mark;else delete state.playerMarks[id];
 persist();
 refreshPlayerMarkDisplay(id);
 // DOMの変更はボタンの選択状態と名前横の絵文字のみに限定する。
 // モーダル自体・スクロール位置・選手詳細は一切再描画しない。
 document.querySelectorAll('button[data-action="set-player-mark"]').forEach(button=>{
  if(button.dataset.id!==id)return;
  const active=button.dataset.mark===mark;
  button.classList.toggle('is-selected',active);
  button.setAttribute('aria-pressed',String(active));
 });
}

// 名球会相当の基準は通算2000安打・200勝・250セーブ。
// 過去に保存済みの年度は現在のstatsと重複計上しない。二刀流も両方集計する。
function hallCareerTotals(p){
 const seasons=p.seasons||[];
 const total={H:0,W:0,SV:0};
 for(const year of seasons){
  const b=year.batting||(p.kind==='b'?year.stats:null)||{};
  const pit=year.pitching||(p.kind==='p'?year.stats:null)||{};
  total.H+=Number(b.H)||0;total.W+=Number(pit.W)||0;total.SV+=Number(pit.SV)||0;
 }
 if(!p.retired&&!seasons.some(y=>y.year===state.year)){
  if(isHitter(p))total.H+=Number(batStats(p).H)||0;
  if(isPitcher(p)){
   total.W+=Number(pitchStats(p).W)||0;
   total.SV+=Number(pitchStats(p).SV)||0;
  }
 }
 return total;
}
function hallAchievements(p){
 const t=hallCareerTotals(p),hits=[];
 if(t.H>=2000)hits.push(`通算${t.H}安打`);
 if(t.W>=200)hits.push(`通算${t.W}勝`);
 if(t.SV>=250)hits.push(`通算${t.SV}セーブ`);
 return hits;
}
function hallStatusHTML(p){
 const achieved=hallAchievements(p);
 const t=hallCareerTotals(p);
 return `<div class="callout"><b>🏅 名球会（ゲーム内の達成判定）</b><div style="margin-top:6px">${achieved.length?`<span class="meikyukai-yes">⭐ 達成済み：${escapeHTML(achieved.join('／'))}</span>`:`<span class="meikyukai-no">未達成</span>`}</div><div class="small" style="margin-top:5px">通算安打 ${t.H.toLocaleString()} / 2,000　・　通算勝利 ${t.W} / 200　・　通算セーブ ${t.SV} / 250</div></div>`;
}

// 二刀流選手は投手起用適性と野手守備適性の双方を必ず持つ。
// 旧セーブに一方の配列が欠けていても、既存の有効な適性を維持したまま補完する。
function ensureTwoWayAptitudes(p){
 if(!p?.twoWay)return p;
 if(!Array.isArray(p.roles)||!p.roles.some(x=>['先','中','抑'].includes(x))){
  const hint=['先','中','抑'].includes(p.natural)?p.natural:'中';
  p.roles=[hint];
 } else p.roles=[...new Set(p.roles.filter(x=>['先','中','抑'].includes(x)))];
 if(!Array.isArray(p.positions)||!p.positions.some(x=>['捕','一','二','三','遊','外'].includes(x)))p.positions=['外'];
 else p.positions=[...new Set(p.positions.filter(x=>['捕','一','二','三','遊','外'].includes(x)))];
 if(p.positions.some(x=>['二','三','遊'].includes(x)))p.throwHand='右';
 return p;
}
const hasPitchRole=(p,r)=>pitchRoles(p).includes(r);
const mixedStarter=p=>isPitcher(p)&&hasPitchRole(p,'先')&&pitchRoles(p).length>1;
// 「先・中」等の兼任適性を持つだけでは兼任起用として扱わない。
// 当該年度の登板記録に基づき、先発のみ=200回、救援のみ=125回、両方=100回とする。
// GS は先発登板数、G-GS は救援登板数。年度替わりの成績リセットで判定も更新される。
function mixedPitchLimit(p,nextRole='current'){
 const st=pitchStats(p),started=(st.GS||0)>0,relieved=(st.G||0)>(st.GS||0);
 if((started||nextRole==='starter')&&(relieved||nextRole==='relief'))return MIXED_IP_CAP;
 return started||nextRole==='starter'||(!relieved&&nextRole==='current')?STARTER_IP_CAP:125;
}
const maxPitchOuts=p=>(mixedStarter(p)?mixedPitchLimit(p):hasPitchRole(p,'先')?STARTER_IP_CAP:125)*3;
function canPitchInGame(p,asStarter=false){
 if(!p||!isPitcher(p)||p.injuryDays>0||pitchStats(p).G>=MAX_RELIEF_APPEARANCES)return false;
 // 新たに先発/救援へ切り替える時は、切り替え後の上限を先読みして判定する。
 // すでに100回を超えて先発だけで投げている選手は、後から救援起用させない。
 const limit=(mixedStarter(p)?mixedPitchLimit(p,asStarter?'starter':'relief')*3:maxPitchOuts(p));
 // 1イニング分の余裕がある投手だけを次のイニングに起用する。
 return pitchStats(p).outs+3<=limit; // 適性外の先発起用も可能（代わりに能力90%）
}

const generatedNames=new Set();
function makeUniquePlayerName(){
 const combinations=FAMILY.length*GIVEN.length;
 for(let tries=0;tries<100;tries++){
  const result=choose(FAMILY)+' '+choose(GIVEN);
  if(!generatedNames.has(result)){generatedNames.add(result);return result}
 }
 // 非常に長いセーブでも、可能な組み合わせを最後まで探して重複を防ぐ。
 const offset=ri(0,combinations-1);
 for(let i=0;i<combinations;i++){
  const idx=(offset+i)%combinations;
  const result=FAMILY[Math.floor(idx/GIVEN.length)]+' '+GIVEN[idx%GIVEN.length];
  if(!generatedNames.has(result)){generatedNames.add(result);return result}
 }
 // 全組み合わせを使い切るほど長いプレイにも対応。
 let suffix=2,result='';do{result=choose(FAMILY)+' '+choose(GIVEN)+'（'+suffix+++'）'}while(generatedNames.has(result));
 generatedNames.add(result);return result;
}

   if(!eligible.length)continue;

   const best=def.get(def.kind==='b'?batStats(eligible[0].p):pitchStats(eligible[0].p));
   // 同率トップは同時受賞（率は小数4桁で判定）
   const winners=eligible.filter(x=>Math.abs(def.get(def.kind==='b'?batStats(x.p):pitchStats(x.p))-best)<(def.key==='AVG'||def.key==='OBP'||def.key==='ERA'||def.key==='WPCT'?0.00005:0.00001));

   leagueAwards[league].push({key:def.key,title:def.name,winners:winners.map(({p,teamId})=>({id:p.id,name:p.name,teamId,display:def.display(def.kind==='b'?batStats(p):pitchStats(p))}))});
  }

}

function appendGoldenGloves(awards){

    p=>batStats(p).UZR*.8+(rangeFactor(batStats(p))||0)*1.6-(batStats(p).E||0)*1.3,

function winnerOf(series){

function playSeriesOne(series,reverseHome=false){

function agePlayer(p){
 p.age++;
 const rise=p.age<=33;
 p.prevAbilities=snapshotAbilities(p);const changes=p.kind==='b'?['meet','power','speed','field','arm','catch']:['stuff','control','stamina'];

 if(isPitcher(p)&&p.age>=35&&hasPitchRole(p,'先')&&!hasPitchRole(p,'中'))p.roles=[...pitchRoles(p),'中'];
 if(isHitter(p)&&rise&&Math.random()<(p.athletic?.18:.09))p.arc=clamp(p.arc+1,1,5);

function makeDraftPool(){

function overall(p){return p.kind==='b'?(p.arc*20+p.meet+p.power+p.speed+p.field+p.arm+p.catch)/7:(p.stuff+p.control+p.stamina)/3}
function battingSkill(p){return p.kind==='b'?(p.arc*20+p.meet+p.power)/3:-1}
function defensiveSkill(p){return p.kind==='b'?(p.field+p.arm+p.catch)/3:-1}
function draftPosition(p){return p.twoWay?`投手 ${pitchRoles(p).join('・')}／野手 ${(p.positions||[]).join('・')}`:p.kind==='b'?p.positions[0]:pitchRoles(p).join('・')}
// 野手の弾道は5段階なので20倍して100点尺度に合わせる。
// 投手と野手は能力項目数が異なるため、スカウト評価は7項目相当の合計に正規化する。
function draftRawCategories(p){
 const result={};
 // 二刀流選手は投打の6項目を独立評価。実数値は公開しない。
 if(isHitter(p))Object.assign(result,{batting:(p.arc*20+p.meet+p.power)/3,running:p.speed,defense:(p.arm+p.field+p.catch)/3});
 if(isPitcher(p))Object.assign(result,{stuff:p.stuff,control:p.control,stamina:p.stamina});

}
function scoutTotal(p){return overall(p)*7}
function devSeries(players,scoreFn){
 const values=players.map(scoreFn),n=values.length;
 const mean=n?values.reduce((sum,v)=>sum+v,0)/n:0;
 const sigma=Math.sqrt(n?values.reduce((sum,v)=>sum+(v-mean)**2,0)/n:0);
 return v=>Math.round(sigma<.00001?50:50+10*(v-mean)/sigma);
}
function scoutLevel(deviation){return deviation<=30?'難':deviation<=44?'並':deviation<=54?'良':deviation<65?'優':'極'}
function scoutClass(label){return ({'難':'hard','並':'ordinary','良':'good','優':'excellent','極':'ultimate'})[label]}

// 二刀流の打撃・走塁・守備は野手候補の分布で、投手3能力は投手候補の分布で偏差値化。
// 各球団の推定誤差は指名年内で固定。旧セーブにない項目だけ補完して、既存評価は維持する。
function initDraftScouting(){
 const all=state.draftPool||[],bats=all.filter(isHitter),pits=all.filter(isPitcher);
 const total=devSeries(all,scoutTotal),devs={};
 for(const [group,keys] of [[bats,['batting','running','defense']],[pits,['stuff','control','stamina']]]){
  for(const key of keys)if(group.length)devs[key]=devSeries(group,p=>draftRawCategories(p)[key]);
 }
 const error=()=>Math.random()<.09?choose([-1,1])*ri(8,12):ri(-5,5);
 for(const p of all){
  p.teamScouts||={};
  const raw=draftRawCategories(p);
  for(const t of TEAMS){
   let estimate=p.teamScouts[t.id];
   if(!estimate){estimate={scout:total(scoutTotal(p))+error(),categories:{},categoryScores:{}};p.teamScouts[t.id]=estimate;}
   estimate.categories ||= {};
   estimate.categoryScores ||= {};
   for(const [key,value] of Object.entries(raw)){
    if(!Number.isFinite(estimate.categoryScores[key])&&!estimate.categories[key]){
     estimate.categoryScores[key]=(devs[key]?.(value)??50)+error();
     estimate.categories[key]=scoutLevel(estimate.categoryScores[key]);
    }else if(!estimate.categories[key]&&Number.isFinite(estimate.categoryScores[key])){
     estimate.categories[key]=scoutLevel(estimate.categoryScores[key]);
    }
   }
  }
 }
}
function getDraftScouting(teamId=state.userId){
 if((state.draftPool||[]).some(p=>!p.teamScouts?.[teamId]||p.twoWay&&Object.keys(draftRawCategories(p)).some(k=>!p.teamScouts[teamId].categories?.[k])))initDraftScouting();

 const usedPitchers=(t.pitching||[]).map(id=>t.roster.find(p=>p.id===id)).filter(p=>p&&isPitcher(p));

 for(const role of batPositions){

// COM's only 1st-round strategy: identify its worst-performing starter position from the
// completed regular season, then bid on the highest-scouted available player eligible there.

function weakestStarterPosition(team){
 const lineup=team.lineup||[];let weakest=null;

  if(!p||!ROLE_B.includes(slot.role)||slot.role==='指')continue;
  const st=p.seasons?.find(x=>x.year===state.year)?.stats||p.stats||newStats('b');
  // Weighted OPS plus field performance per game, giving defensive positions a small

  const hasSample=(st.PA||0)>=80;

  const defense=slot.role==='指'?0:((st.UZR||0)*10-(st.E||0)*4)/Math.max(10,st.G||0);

}

// 8月末に年齢・能力低下を考慮して引退を申し出る。
// 申し出は各球団年間最大1名、監督が説得すれば当年度は引退しない。
function retirementCandidate(team){
 const roster=team.roster.filter(p=>!p.foreign&&!p.retired&&p.age>=35);
 const eligible=roster.map(p=>{
  const abilities=p.kind==='b'?['meet','power','speed','field','arm','catch']:['stuff','control','stamina'];
  const declined=abilities.reduce((v,k)=>v+Math.max(0,(Number(p.prevAbilities?.[k])||p[k])-p[k]),0)/abilities.length;
  const strength=overall(p);
  const score=(p.age-35)*.065+Math.max(0,59-strength)*.014+declined*.025;
  return {p,score};
 }).filter(x=>x.p.age>=39||x.score>=.10).sort((a,b)=>b.score-a.score);
 if(!eligible.length)return null;
 // 一人のベテランが優先して申請する。必ず毎年発生するわけではない。
 const picked=eligible[0];return Math.random()<Math.min(.82,.13+picked.score)?picked.p:null;
}

function transferRetiredToArchive(){
 state.retiredPlayers||=[];
 for(const team of Object.values(state.teams)){
  const departures=team.roster.filter(p=>p.retired);
  if(!departures.length)continue;
  for(const p of departures){
   if(!state.retiredPlayers.some(x=>x.id===p.id))state.retiredPlayers.push({...p,retiredTeamId:team.id});
  }
  team.roster=team.roster.filter(p=>!p.retired);
  for(const p of departures.filter(x=>!x.foreign)){
   const kind=p.kind;
   const natural=kind==='b'?(p.positions?.[0]||'外'):(pitchRoles(p)[0]||'中');
   const replacement=makePlayer(kind,natural,ri(18,24),true);
   // 引退による戦力補充はドラフトではなく育成枠の昇格。
   for(const k of (kind==='b'?['meet','power','speed','field','arm','catch']:['stuff','control','stamina']))replacement[k]=clamp(Math.min(58,replacement[k]));
   replacement.developmentPromotionYear=state.year+1;
   team.roster.push(replacement);
   if(team.id===state.userId)pushNews({teamId:team.id,playerId:replacement.id,kind:'retirement',priority:30,title:`${replacement.name}が育成枠から昇格`,text:`引退に伴う選手登録枠を補いました。`});
  }
 }
}

  logEvent(text);msg ||= text;

// Ver.10.12: ゲーム内WAR（代替選手に対する推定勝利貢献）。
// 球場補正・完全なプレー単位の守備/走塁記録がないため、公式fWAR/bWARとは異なる。
// 同じ式を全年度に適用し、セーブ済みの過去年成績からも再計算できる。
function battingWAR(s,p){
 if(!s||(s.PA||0)<=0)return 0;
 const pa=Math.max(0,Number(s.PA)||0),ab=Math.max(0,Number(s.AB)||0),bb=Math.max(0,Number(s.BB)||0);

 const hittingRuns=(woba-.315)/1.25*pa;

 const positionRuns=(fieldG>0?adjusted/fieldG:-13)*pa/600;

// 現時点での守備位置別WAR。野手WARを守備位置別出場数で按分する。
// 現行ゲームは外野3位置を一括計上し、DHと代打は厳密に分離していない。
// 投手WARは実際の先発回数から推定した先発イニングと救援イニングで按分する。
function positionWarBreakdown(team){
 const ids=['捕','一','二','三','遊','左','中','右','外','DH','先発','救援'];
 const result=Object.fromEntries(ids.map(id=>[id,{war:0,appearances:0}]));
 const posGroup=k=>k==='指'?'DH':k;
 for(const p of team.roster||[]){
  if(isHitter(p)){
   const st=batStats(p),war=battingWAR(st,p),pos=st.positionG||{};
   const appearances={};let fieldGames=0;
   for(const [key,val] of Object.entries(pos)){
    const group=posGroup(key),games=Math.max(0,Number(val)||0);
    if(group in result && group!=='DH'&&group!=='先発'&&group!=='救援'){
     appearances[group]=(appearances[group]||0)+games;fieldGames+=games;
    }
   }
   // DH/代打出場は守備出場数との差で推定。記録のない旧セーブにも対応。
   const totalGames=Math.max(fieldGames,Math.max(0,Number(st.G)||0));
   const dhGames=Math.max(0,totalGames-fieldGames);
   if(dhGames)appearances.DH=dhGames;
   const sum=Object.values(appearances).reduce((a,b)=>a+b,0);
   if(sum>0){
    for(const [group,games] of Object.entries(appearances)){
     result[group].war+=war*games/sum;
     result[group].appearances+=games;
    }
   }else if((st.PA||0)>0){
    // ごく古いデータで守備記録がない場合はDH/代打へ一括計上。
    result.DH.war+=war;result.DH.appearances++;
   }
  }
  if(isPitcher(p)){
   const st=pitchStats(p),outs=Math.max(0,Number(st.outs)||0);
   if(!outs)continue;
   const games=Math.max(0,Number(st.G)||0),starts=Math.min(games,Math.max(0,Number(st.GS)||0));
   const reliefGames=Math.max(0,games-starts);
   let startOuts=0;
   if(!reliefGames)startOuts=outs;
   else if(!starts)startOuts=0;
   else startOuts=Math.min(outs,starts*17); // 先発1登板を約5回2/3と見なす推定
   const w=pitchingWAR(st),share=startOuts/outs;

   result['先発'].appearances+=starts;result['救援'].appearances+=reliefGames;
  }
 }

function benchHitters(team){const starters=new Set((team.lineup||[]).map(r=>r.id));return team.roster.filter(p=>isHitter(p)&&available(p)&&!starters.has(p.id))}
function syncPinchWithBench(team){const bench=benchHitters(team);if(!bench.some(p=>p.id===team.pinch))team.pinch=[...bench].sort((a,b)=>hitScore(b)-hitScore(a))[0]?.id||'';if(team.pinchRun&&!bench.some(p=>p.id===team.pinchRun))team.pinchRun='';if(team.defSub&&!bench.some(p=>p.id===team.defSub))team.defSub='';}
function benchDefenseOptions(players,val){return '<option value="">指定しない</option>'+players.map(p=>`<option value="${p.id}" ${p.id===val?'selected':''}>${escapeHTML(p.name)} / 走${p.speed} 守${p.field} 肩${p.arm} 捕${p.catch}</option>`).join('')}
// 野手の中堅「中」と、投手の中継ぎ「中」は文字が同じため、
// 選択欄の種類（bat / pitch）を必ず明示して判定する。
function optionPlayers(players,val,role='',context='bat'){
 const isPitchSlot=context==='pitch';
 return `<option value="">選択してください</option>`+players.map(p=>{
  const fits=!role?false:isPitchSlot?hasPitchRole(p,role):(role==='指'||(p.positions||[]).includes(DEF[role]));
  const info=isPitchSlot
   ?` / ${pitchRoles(p).join('・')} 球${p.stuff} 制${p.control} ス${p.stamina}`
   :` / 弾${p.arc} ミ${p.meet} パ${p.power} 走${p.speed}`;
  return `<option value="${p.id}" ${p.id===val?'selected':''} ${!available(p)?'disabled':''} ${fits?'class="adapted-option"':''}>${escapeHTML(p.name)} (${p.age}歳${info})</option>`;
 }).join('');
}
function lineupMiniAbilities(p,context='bat'){

 return `<div class="lineup-quickstats">${context==='pitch'?`${inlineAbility('球',p.stuff)} ${inlineAbility('制',p.control)} ${inlineAbility('ス',p.stamina)}`:`弾道${p.arc} ${inlineAbility('ミ',p.meet)} ${inlineAbility('パ',p.power)} ${inlineAbility('走',p.speed)}`}</div>`;
}

// Standard games-behind calculation: (leaderW-teamW + teamL-leaderL)/2.
function gamesBehind(leader,team){
 const result=((leader.record.W-team.record.W)+(team.record.L-leader.record.L))/2;
 return Math.abs(result)<1e-9?'0.0':result.toFixed(1);
}
// Reference magic number for the game: remaining fixtures and direct head-to-heads
// are accounted for. Since future ties/tie-breakers are not deterministic, display
// as an in-game estimate (参考M), not the official NPB magic number.
function remainingDirectGames(id1,id2){
 let total=0;
 for(const day of (state.schedule||[]).slice(state.day||0))for(const g of day.games||[]){
  if((g.home===id1&&g.away===id2)||(g.away===id1&&g.home===id2)){
   if(g.result==null)total++;
  }
 }
 return total;
}
function standingsMagic(league,ranked){
 const teams=ranked||getStandings(league),first=teams[0];if(!first)return null;
 const remain=Math.max(0,143-first.record.G),rivals=teams.slice(1);
 if(teams.every(t=>t.record.G===143))return {id:first.id,number:0,decided:true};
 const rivalData=rivals.map(t=>({team:t,remaining:Math.max(0,143-t.record.G),direct:remainingDirectGames(first.id,t.id)}));
 const ratio=(w,l)=>w+l>0?w/(w+l):0;
 // Only light the magic if every rival has lost its own-win path.
 for(const r of rivalData){
  const ownWinsWithoutHead=first.record.W+Math.max(0,remain-r.direct);
  const ownLossesWithHead=first.record.L+r.direct;
  const rivalWinsAll=r.team.record.W+r.remaining;
  if(ratio(rivalWinsAll,r.team.record.L)>=ratio(ownWinsWithoutHead,ownLossesWithHead)-1e-10)return null;
 }
 // Conservative clinch threshold: leader wins k, rivals win every other possible game.
 for(let k=0;k<=remain;k++){
  const leaderPct=ratio(first.record.W+k,first.record.L+remain-k);
  const safe=rivalData.every(r=>{
   const mustBeatRival=Math.max(0,k-(remain-r.direct));
   const rivalPct=ratio(r.team.record.W+r.remaining-mustBeatRival,r.team.record.L+mustBeatRival);
   return leaderPct>rivalPct+1e-10;
  });
  if(safe)return {id:first.id,number:k,decided:k===0};
 }
 return null;
}

function parseScheduleCSV(raw){
 const lines=raw.replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
 if(lines.length&&/^(date|日付),/i.test(lines[0]))lines.shift();
 const dates=new Map(),pair=new Map(),total=Object.fromEntries(TEAMS.map(t=>[t.id,0]));
 const ids=new Set(TEAMS.map(t=>t.id));
 let count=0;
 for(const [i,line] of lines.entries()){
  const parts=line.split(',').map(x=>x.trim()),[date,h,a]=parts;
  if(parts.length<3||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!ids.has(h)||!ids.has(a)||h===a)throw Error(`${i+1}行目: 日付または球団IDが不正です。`);
  if(!date.startsWith(String(state.year)+'-'))throw Error(`${i+1}行目: シーズン年が一致しません。`);
  const d=new Date(date+'T12:00:00');if(!Number.isFinite(d.getTime())||`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`!==date)throw Error(`${i+1}行目: 存在しない日付です。`);
  const key=[h,a].sort().join(':'),kind=meta(h).league===meta(a).league?'リーグ':'交流戦';
  pair.set(key,(pair.get(key)||0)+1);total[h]++;total[a]++;count++;
  if(!dates.has(date))dates.set(date,[]);
  if(dates.get(date).some(m=>[m.home,m.away].includes(h)||[m.home,m.away].includes(a)))throw Error(`${date}: 同じ球団が同日に2試合あります。`);
  dates.get(date).push({home:h,away:a,kind,result:null});
 }
 if(count!==858)throw Error(`総試合数が${count}です。858試合必要です。`);
 if(Object.values(total).some(n=>n!==143))throw Error('各球団143試合になっていません。');
 for(let i=0;i<TEAMS.length;i++)for(let j=i+1;j<TEAMS.length;j++){
  const a=TEAMS[i],b=TEAMS[j],expected=a.league===b.league?25:3;
  if((pair.get([a.id,b.id].sort().join(':'))||0)!==expected)throw Error(`${a.short}対${b.short}の試合数が${expected}試合ではありません。`);
 }
 return [...dates].sort(([a],[b])=>a.localeCompare(b)).map(([date,games])=>({date,games}));
}

function playerCareerHtml(p){
 const finished=[...(p.seasons||[])].sort((a,b)=>a.year-b.year);
 const rows=finished.map(x=>({year:x.year,teamId:x.teamId,age:x.age,stats:x.stats,batting:x.batting,pitching:x.pitching,ongoing:false}));
 if(!finished.some(x=>x.year===state.year)&&(batStats(p)?.PA>0||pitchStats(p)?.G>0))rows.push({year:state.year,teamId:Object.values(state.teams).find(t=>t.roster.some(z=>z.id===p.id))?.id,age:p.age,stats:p.stats,batting:p.twoWay?batStats(p):null,pitching:p.twoWay?pitchStats(p):null,ongoing:true});
 const keys=p.kind==='b'?['G','PA','AB','H','HR','RBI','SB','E','BB','SO']:['G','GS','outs','W','L','SV','HLD','HP','SO','BB','H'];
 const total=Object.fromEntries(keys.map(k=>[k,rows.reduce((z,x)=>z+(Number(x.stats?.[k])||0),0)]));
 const batting=p.kind==='b';
 const warRows=rows.map(x=>historicWAR(p,x));
 const warSum=warRows.reduce((a,b)=>a+b,0);
 const totals=batting?[['試合',total.G],['打率',avg(total)],['安打',total.H],['本塁打',total.HR],['打点',total.RBI],['盗塁',total.SB]]:
  [['登板',total.G],['先発',total.GS],['勝利',total.W],['防御率',era({...total,ER:rows.reduce((z,x)=>z+(x.stats?.ER||0),0)})],['セーブ',total.SV],['ホールド',total.HLD],['奪三振',total.SO]];
 totals.unshift(['通算WAR',warDisplay(warSum)]);
 const headings=batting?['年度','所属','試合','打率','安打','本塁打','打点','盗塁','OPS','WAR']:['年度','所属','登板','先発','勝','敗','防御率','投球回','HP','セーブ','WAR'];
 const fields=x=>batting?[x.year+(x.ongoing?'*':''),meta(x.teamId)?.short||'—',x.stats?.G||0,avg(x.stats||{}),x.stats?.H||0,x.stats?.HR||0,x.stats?.RBI||0,x.stats?.SB||0,ops(x.stats||{}),warDisplay(historicWAR(p,x))]:
  [x.year+(x.ongoing?'*':''),meta(x.teamId)?.short||'—',x.stats?.G||0,x.stats?.GS||0,x.stats?.W||0,x.stats?.L||0,era(x.stats||{}),`${Math.floor((x.stats?.outs||0)/3)}.${(x.stats?.outs||0)%3}`,x.stats?.HP||0,x.stats?.SV||0,warDisplay(historicWAR(p,x))];
 return `<div class="record-subtitle">📊 通算成績${rows.some(x=>x.ongoing)?'（今季途中を含む）':''}</div><div class="career-row">${totals.map(([label,value])=>`<span class="career-chip">${label}<b>${value}</b></span>`).join('')}</div><div class="record-subtitle">📅 年度別成績</div><div class="tablewrap"><table class="record-table"><thead><tr>${headings.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(x=>`<tr>${fields(x).map(y=>`<td>${escapeHTML(y)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headings.length}">出場記録なし</td></tr>`}</tbody></table></div><div class="record-subtitle">🏅 タイトル獲得歴</div><div>${p.titles?.length?p.titles.slice().sort((a,b)=>b.year-a.year).map(t=>`<span class="trophy-tag">🏆 ${t.year}年 ${t.league} ${escapeHTML(t.title)}</span>`).join(''):'タイトル獲得なし'}</div>${p.draft1?`<p class="small" style="margin-bottom:0"><b>🎖️ ${p.draft1.year}年 ドラフト1位入団</b>（${meta(p.draft1.team)?.short||''}）</p>`:''}`;
}

function matchResultCard(m){
 if(!m?.result)return '<p class="empty">試合結果が見つかりません。</p>';

 const rounds=Math.max(r.innings||9,r.linesAway?.length||0,r.linesHome?.length||0);

function autoPick(){
 const bats=state.pool.filter(p=>p.kind==='b'),pits=state.pool.filter(p=>p.kind==='p');
 const choice=[],seen=new Set();
 for(const [pos,n] of [['捕',2],['一',1],['二',1],['三',1],['遊',1],['外',4]]){
  let count=0;
  for(const p of bats.filter(p=>p.positions.includes(pos)&&!seen.has(p.id)).sort((a,b)=>hitScore(b)-hitScore(a))){
   if(count>=n)break;choice.push(p);seen.add(p.id);count++;
  }
 }
 for(const p of bats.filter(p=>!seen.has(p.id)).sort((a,b)=>hitScore(b)-hitScore(a))){if(choice.length>=15)break;choice.push(p);seen.add(p.id)}
 const sp=pits.filter(p=>p.natural==='先').sort((a,b)=>pitchScore(b)-pitchScore(a)).slice(0,5);
 const pp=pits.filter(p=>!sp.includes(p)).sort((a,b)=>pitchScore(b)-pitchScore(a)).slice(0,10);
 state.selection=[...choice,...sp,...pp].map(p=>p.id);persist();render();
}

function reorderBatting(from,to){
 if(!Number.isInteger(from)||!Number.isInteger(to)||from===to||from<0||to<0||from>=9||to>=9)return;
 const t=user();ensureUsageLocks(t);
 const row=t.lineup.splice(from,1)[0],lock=t.batLocks.splice(from,1)[0];
 t.lineup.splice(to,0,row);t.batLocks.splice(to,0,lock);
 persist();render();
}
let dragRow=-1,touchOrigin=-1,touchLast=-1,touchArmed=false,touchPressTimer=null;
document.addEventListener('dragstart',e=>{const row=e.target.closest('[data-order-row]');if(row){dragRow=Number(row.dataset.orderRow);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-order-row]'))e.preventDefault()});
document.addEventListener('drop',e=>{const row=e.target.closest('[data-order-row]');if(row&&dragRow>=0){e.preventDefault();reorderBatting(dragRow,Number(row.dataset.orderRow));dragRow=-1}});
document.addEventListener('touchstart',e=>{const row=e.target.closest('[data-order-row]');if(row&&e.target.closest('.lineup-number')){touchOrigin=Number(row.dataset.orderRow);touchLast=touchOrigin;touchArmed=false;clearTimeout(touchPressTimer);touchPressTimer=setTimeout(()=>{touchArmed=true},320)}},{passive:true});
document.addEventListener('touchmove',e=>{if(touchOrigin<0||!touchArmed)return;const touch=e.changedTouches[0],target=document.elementFromPoint(touch.clientX,touch.clientY)?.closest('[data-order-row]');if(target)touchLast=Number(target.dataset.orderRow)},{passive:true});
document.addEventListener('touchend',()=>{clearTimeout(touchPressTimer);if(touchOrigin>=0&&touchArmed)reorderBatting(touchOrigin,touchLast);touchOrigin=-1;touchLast=-1;touchArmed=false},{passive:true});

 }

 else if(k==='bat-player'){user().lineup[Number(el.dataset.index)].id=v;ensureUsageLocks(user());user().batLocks[Number(el.dataset.index)]=false;syncPinchWithBench(user());}
